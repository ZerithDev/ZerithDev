<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="248" viewBox="0 0 1280 248" role="img" aria-label="Sorotan fokus pengembangan Zerith"><defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#170304"/><stop offset="100%" stop-color="#33070B"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F76E78"/><stop offset="100%" stop-color="#B81823"/></linearGradient><filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer></filter></defs><rect width="1280" height="248" rx="24" fill="#0F0203"/><rect x="18" y="18" width="1244" height="212" rx="20" fill="url(#card)"/><g filter="url(#grain)" opacity="0.35"><rect x="18" y="18" width="1244" height="212" rx="20" fill="#fff"/></g><rect x="44" y="43" width="96" height="6" rx="3" fill="url(#line)"/><text x="44" y="82" fill="#FFFFFF" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Fokus Pengembangan</text><text x="44" y="112" fill="#DDB9BE" font-size="16" font-family="Arial, Helvetica, sans-serif">Tiga hal yang paling saya jaga saat membangun antarmuka.</text><g transform="translate(42,140)"><rect width="372" height="60" rx="14" fill="#220406" stroke="#5B0A10"/><circle cx="30" cy="30" r="10" fill="#D8454F"/><text x="58" y="26" fill="#FFFFFF" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">Desain yang Terarah</text><text x="58" y="46" fill="#DDB9BE" font-size="13.5" font-family="Arial, Helvetica, sans-serif">Struktur visual jelas, rapi, dan mudah diikuti.</text></g><g transform="translate(454,140)"><rect width="372" height="60" rx="14" fill="#220406" stroke="#5B0A10"/><circle cx="30" cy="30" r="10" fill="#D8454F"/><text x="58" y="26" fill="#FFFFFF" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">Komponen yang Konsisten</text><text x="58" y="46" fill="#DDB9BE" font-size="13.5" font-family="Arial, Helvetica, sans-serif">Reusable, selaras, dan lebih mudah dirawat.</text></g><g transform="translate(866,140)"><rect width="372" height="60" rx="14" fill="#220406" stroke="#5B0A10"/><circle cx="30" cy="30" r="10" fill="#D8454F"/><text x="58" y="26" fill="#FFFFFF" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">Penyempurnaan Berkelanjutan</text><text x="58" y="46" fill="#DDB9BE" font-size="13.5" font-family="Arial, Helvetica, sans-serif">Terus merapikan detail dan pengalaman pengguna.</text></g></svg>