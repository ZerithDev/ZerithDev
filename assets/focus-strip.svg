<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="228" viewBox="0 0 1280 228" role="img" aria-label="Fokus utama Zerith">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66040B"/>
      <stop offset="100%" stop-color="#430308"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78050E"/>
      <stop offset="100%" stop-color="#59040B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5867"/>
      <stop offset="100%" stop-color="#FF2B4C"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="1256" height="204" rx="24" fill="url(#panel)" stroke="#7F0C15" stroke-width="1.5"/>

  <rect x="44" y="34" width="98" height="6" rx="3" fill="url(#line)"/>
  <text x="44" y="76" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">Fokus Utama</text>
  <text x="44" y="102" fill="#F3C7CC" font-size="14" font-family="Arial, Helvetica, sans-serif">Tiga hal yang paling saya jaga saat membangun antarmuka.</text>

  <g transform="translate(44,126)">
    <rect width="372" height="58" rx="14" fill="url(#card)" stroke="#A6111D"/>
    <circle cx="24" cy="29" r="8" fill="#FF1F57"/>
    <text x="48" y="26" fill="#FFFFFF" font-size="17.5" font-weight="700" font-family="Arial, Helvetica, sans-serif">Desain yang Terarah</text>
    <text x="48" y="44" fill="#F2C7CC" font-size="12.5" font-family="Arial, Helvetica, sans-serif">Visual rapi, terstruktur, dan mudah dipahami.</text>
  </g>

  <g transform="translate(454,126)">
    <rect width="372" height="58" rx="14" fill="url(#card)" stroke="#A6111D"/>
    <circle cx="24" cy="29" r="8" fill="#FF1F57"/>
    <text x="48" y="26" fill="#FFFFFF" font-size="17.5" font-weight="700" font-family="Arial, Helvetica, sans-serif">Komponen yang Konsisten</text>
    <text x="48" y="44" fill="#F2C7CC" font-size="12.5" font-family="Arial, Helvetica, sans-serif">Reusable dan tetap selaras di banyak halaman.</text>
  </g>

  <g transform="translate(864,126)">
    <rect width="372" height="58" rx="14" fill="url(#card)" stroke="#A6111D"/>
    <circle cx="24" cy="29" r="8" fill="#FF1F57"/>
    <text x="48" y="26" fill="#FFFFFF" font-size="17.5" font-weight="700" font-family="Arial, Helvetica, sans-serif">Detail yang Diperhalus</text>
    <text x="48" y="44" fill="#F2C7CC" font-size="12.5" font-family="Arial, Helvetica, sans-serif">Keterbacaan, spacing, dan kenyamanan selalu diperbaiki.</text>
  </g>
</svg>
