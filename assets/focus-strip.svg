<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="214" viewBox="0 0 1280 214" role="img" aria-label="Fokus utama Zerith"><defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#160304"/><stop offset="100%" stop-color="#35070B"/></linearGradient></defs><rect width="1280" height="214" rx="22" fill="#0D0203"/><g transform="translate(18,18)"><rect width="1244" height="178" rx="18" fill="url(#c)"/><text x="28" y="42" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Arial, Helvetica, sans-serif">Fokus Utama</text><text x="28" y="68" fill="#DDB9BE" font-size="15" font-family="Arial, Helvetica, sans-serif">Tiga hal yang paling saya jaga saat membangun antarmuka.</text><g transform="translate(28,95)"><rect width="380" height="58" rx="14" fill="#220406" stroke="#5A0A10"/><circle cx="30" cy="29" r="9" fill="#DD4450"/><text x="56" y="25" fill="#FFFFFF" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Desain yang Terarah</text><text x="56" y="43" fill="#DDB9BE" font-size="13" font-family="Arial, Helvetica, sans-serif">Visual rapi, terstruktur, dan mudah dipahami.</text></g><g transform="translate(432,95)"><rect width="380" height="58" rx="14" fill="#220406" stroke="#5A0A10"/><circle cx="30" cy="29" r="9" fill="#DD4450"/><text x="56" y="25" fill="#FFFFFF" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Komponen yang Konsisten</text><text x="56" y="43" fill="#DDB9BE" font-size="13" font-family="Arial, Helvetica, sans-serif">Reusable dan tetap selaras di banyak halaman.</text></g><g transform="translate(836,95)"><rect width="380" height="58" rx="14" fill="#220406" stroke="#5A0A10"/><circle cx="30" cy="29" r="9" fill="#DD4450"/><text x="56" y="25" fill="#FFFFFF" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Detail yang Diperhalus</text><text x="56" y="43" fill="#DDB9BE" font-size="13" font-family="Arial, Helvetica, sans-serif">Keterbacaan, spacing, dan kenyamanan selalu diperbaiki.</text></g></g></svg>